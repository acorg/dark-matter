# --- Category 11 -------------------------------------------------------

[[script]]
name = "ids.py"
category = 11
description = """
Print a generated sequence of ids (e.g., `id1`, `id2`, ... or a custom
prefix and numeric range), with options for separators and zero-padding.
General-purpose scripting/test-data helper; not specific to biological
sequences.
"""

[[script]]
name = "dark-matter-version.py"
category = 11
description = "Print the installed `dark-matter` package version."

# --- Deprecated ----------------------------------------------------------

[[script]]
name = "compare-consensuses.py"
category = 12
description = """
Compare different consensus-making methods (presumably running several of
the above and diffing/scoring the results).
"""

[[script]]
name = "convert-sam-to-fastq.sh"
category = 12
description = """
Read SAM (see http://samtools.github.io/hts-specs/SAMv1.pdf) from stdin
and write FASTQ to stdout. The `+` line of each FASTQ record also repeats
the sequence id, since some FASTQ-consuming tools insist on it being
present even though it's technically optional. (Not previously listed in
this document — added when generating it from doc/scripts.toml.)
"""

[[script]]
name = "filter-fasta-by-taxonomy.py"
category = 12
description = """
Depends on NCBI's GI numbering scheme, which NCBI retired in 2016, so
this will silently do nothing useful on modern NCBI data unless you still
have old-style FASTA/hit files lying around. (Also listed in category 1,
where it still appears as a FASTA filter.)
"""

[[script]]
name = "noninteractive-alignment-panel.py"
category = 12
description = """
The same alignment-panel functionality as `alignment-panel-civ.py`,
generated non-interactively (these two scripts look very close in
structure/intent — worth checking whether one has simply superseded the
other).
"""

[[script]]
name = "proteins-to-pathogens.py"
category = 12
description = """
Group protein match output (as produced by the alignment-panel scripts
above) by the pathogen each protein comes from, using the pathogen
accession number embedded in the "civ"-style subject title.
"""

[[script]]
name = "sam-to-fasta-alignment.py"
category = 12
description = "Produce aligned FASTA queries from a SAM/BAM file."

